{% extends "base.html" %}

{% block title %}{{ t('error404.page_title') }}{% endblock %}
{% block page_heading %}{{ t('error404.heading') }}{% endblock %}

{% block content %}
<div class="viewer-card error-card">
  <div style="margin-bottom: var(--space-4);">
    <i class="ti ti-file-x error-icon" aria-hidden="true"></i>
  </div>
  <h2 class="error-title">{{ t('error404.title') }}</h2>
  <p class="error-message">
    {{ t('error404.message') }}
  </p>
  <div>
    <a href="/" class="btn btn-primary">
      <i class="ti ti-plus" aria-hidden="true"></i>
      <span>{{ t('error404.create_new') }}</span>
    </a>
  </div>
</div>
{% endblock %}
